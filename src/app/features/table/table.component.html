<div class="table-page">
  <h1 class="page-title">Lista de eventos</h1>

  <div class="card filter-card">
    <div class="filter-grid">
      <div class="form-group">
        <label class="form-label">Tipo de Evento</label>
        <select #type class="form-control">
          <option selected value="">Seleccione el tipo del evento</option>
          @for (item of listTypes; track $index) {
            <option [value]="item">{{item}}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Fecha de inicio</label>
        <input type="date" #startDate class="form-control">
      </div>
      <div class="form-group">
        <label class="form-label">Fecha final</label>
        <input type="date" #endDate class="form-control">
      </div>
      <div class="filter-action">
        <button class="btn btn--primary" (click)="filterType(type.value, startDate.value, endDate.value)">
          🔍 Filtrar
        </button>
      </div>
    </div>
  </div>

  @if (listEvents.length >= 1) {
    <div class="data-table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th>Nombre evento</th>
            <th>Descripción</th>
            <th>Tipo de evento</th>
            <th>Fecha de creación</th>
          </tr>
        </thead>
        <tbody>
          @for (item of listEvents; track $index) {
            <tr>
              <td>{{item.title}}</td>
              <td class="description-cell">{{ parce(item.description) | json }}</td>
              <td>
                <span [class]="'badge badge--' + item.typeEvent">{{item.typeEvent}}</span>
              </td>
              <td>{{item.createDate}}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  } @else {
    <div class="empty-state">
      <span class="empty-state__icon">📭</span>
      <p class="empty-state__text">No se encontraron resultados</p>
    </div>
  }
</div>
