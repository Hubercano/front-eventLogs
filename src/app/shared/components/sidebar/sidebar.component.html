<aside class="sidebar" [class.sidebar--collapsed]="collapsed">
  <div class="sidebar__logo-area">
    <div class="sidebar__logo">
      <span class="sidebar__logo-icon">⚡</span>
      @if (!collapsed) {
        <span class="sidebar__logo-text">EventLogs</span>
      }
    </div>
    <button class="sidebar__toggle" (click)="onToggle()" aria-label="Toggle sidebar">
      <span class="sidebar__toggle-icon">{{ collapsed ? '☰' : '✕' }}</span>
    </button>
  </div>

  <nav class="sidebar__nav">
    @for (item of navItems; track item.route) {
      <a
        class="sidebar__nav-item"
        [routerLink]="item.route"
        routerLinkActive="sidebar__nav-item--active"
        [title]="item.label">
        <span class="sidebar__nav-icon">{{ item.icon }}</span>
        @if (!collapsed) {
          <span class="sidebar__nav-label">{{ item.label }}</span>
        }
      </a>
    }
  </nav>
</aside>
