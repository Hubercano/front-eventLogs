<header class="header">
  <div class="header__brand">
    <span class="header__brand-icon">⚡</span>
    <span class="header__brand-name">EventLogs</span>
  </div>

  <div class="header__actions">
    @if (storedUser) {
      <div class="header__user">
        <div class="header__avatar">{{ storedUser.name?.charAt(0)?.toUpperCase() }}</div>
        <span class="header__username">{{ storedUser.name }}</span>
      </div>
      <button class="btn btn--outline btn--sm" (click)="logout()">
        <span>🚪</span> Cerrar sesión
      </button>
    } @else {
      <a class="btn btn--primary btn--sm" routerLink="/login">
        <span>🔐</span> Iniciar sesión
      </a>
    }
  </div>
</header>
